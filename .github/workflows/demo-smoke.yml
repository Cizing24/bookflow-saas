name: Public Demo Smoke
on:
  push:
    branches: [codex/demo-deployment-2026-11-14]
    paths:
      - scripts/demo-public-smoke.mjs
      - .github/workflows/demo-smoke.yml
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/demo-public-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-demo-evidence
          path: public-demo-evidence/
          retention-days: 7
