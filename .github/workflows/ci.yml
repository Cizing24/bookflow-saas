name: BookFlow CI
on:
  push:
    branches: [main, "phase*-*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: bookflow_dev
          POSTGRES_DB: bookflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bookflow -d bookflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookflow:bookflow_dev@127.0.0.1:5433/bookflow
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-fixture-only-not-a-production-secret-2026-bookflow
      E2E_SERVER_COMMAND: npm run start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run db:seed
        env:
          SEED_PASSWORD: ci-synthetic-seed-password-2026
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:migrations
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: docker build --tag bookflow:ci .
      - run: docker build --target tools --tag bookflow-tools:ci .
      - name: Container readiness and migration smoke
        run: |
          docker run --rm --network host -e DATABASE_URL bookflow-tools:ci npm run db:migrate
          docker run -d --name bookflow-ci --network host -e PORT=3001 -e DATABASE_URL -e BETTER_AUTH_URL=http://localhost:3001 -e BETTER_AUTH_SECRET bookflow:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3001/health; then exit 0; fi
            sleep 2
          done
          docker logs bookflow-ci
          exit 1
