name: BookFlow CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: bookflow_dev
          POSTGRES_DB: bookflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bookflow -d bookflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookflow:bookflow_dev@127.0.0.1:5433/bookflow
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-fixture-only-not-a-production-secret-2026-bookflow
      E2E_SERVER_COMMAND: npm run start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:migrations
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
